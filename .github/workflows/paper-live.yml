name: paper-live-monitor

on:
  schedule:
    - cron: "40 3 * * 1-5"   # 09:10 IST, Monday to Friday
    - cron: "10 4 * * 1-5"   # 09:40 IST backup start
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - name: Live monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_MAX_MINUTES: "340"
        run: python bot.py --live
      - name: Save account state
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "live update" && git pull --rebase origin main && git push)
